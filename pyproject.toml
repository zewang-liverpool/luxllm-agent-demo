[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luxllm-agent"
version = "1.0.0"
description = "Reproducible Lux AI Season 3 LLM-agent research artefact"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
authors = [
  {name = "Ze Wang", email = "Z.Wang300@liverpool.ac.uk"},
  {name = "Meng Fang", email = "mfang@liverpool.ac.uk"},
]
dependencies = ["luxai-s3==0.2.1"]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/agent", "src/viewer_tools", "tools"]
addopts = "-ra"
